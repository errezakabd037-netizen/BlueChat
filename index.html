<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueChat AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
</div>

<div class="app">

<header>

<button class="menu-btn">☰</button>

<div class="logo-area">
<img src="logo.png" alt="BlueChat">
<h1>BlueChat</h1>
</div>

<button class="settings-btn">⚙️</button>

</header>

<main id="chat">

<div class="bot-message">
👋 Welcome to BlueChat AI
</div>

</main>

<footer>

<label class="attach-btn">
📎
<input type="file" hidden>
</label>

<input
id="messageInput"
type="text"
placeholder="Message BlueChat AI..."
>

<button id="sendBtn">
➤
</button>

</footer>

</div>

<script src="script.js"></script>

</body>
</html>
