<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueChat AI</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07131f">
</head>

<body>

<div class="sidebar">
</div>

<div class="app">

<header>

<button class="menu-btn">☰</button>

<div class="logo-area">
<img src="logo.png" alt="BlueChat">
<h1>BlueChat</h1>
</div>

<button class="settings-btn">⚙️</button>

</header>

<main id="chat">

<div class="bot-message">
👋 Welcome to BlueChat AI
</div>

</main>

<footer>

<label class="attach-btn">
📎
<input type="file" hidden>
</label>

<textarea
id="messageInput"
rows="1"
placeholder="Message BlueChat AI..."
></textarea>

<button id="sendBtn">
➤
</button>

</footer>

</div>

<script src="script.js"></script>

</body>
</html>
